[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskhome"
version = "2.0.0"
description = "Scheduled tasks and alerts, printed on a USB thermal receipt printer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mica-alex" }]
keywords = ["escpos", "receipt-printer", "home-automation", "flask"]

# Kept in step with requirements.txt, which stays the source of truth for a
# reproducible deploy: pinned there, ranged here. A library pinned to an exact
# Flask makes the package uninstallable alongside anything else.
dependencies = [
    "Flask>=3.0,<4",
    "python-escpos>=3.1,<4",
    "pyusb>=1.2,<2",
    "requests>=2.31,<3",
    "qrcode>=7.4,<9",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.urls]
Homepage = "https://github.com/mica-alex/TaskHome"

[project.scripts]
# `taskhome` on PATH after `pip install -e .`, so the systemd unit does not
# have to know where the checkout lives.
taskhome = "taskhome.cli:main"

[tool.setuptools.packages.find]
include = ["taskhome*"]

[tool.setuptools.package-data]
taskhome = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
